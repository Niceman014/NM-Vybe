name: nm_vybe
description: "NM VYBE — a local-first music player. Your music. Your vibe."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Audio engine
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  audio_service: ^0.18.19
  audio_session: ^0.2.4

  # Local library & storage
  path_provider: ^2.1.6
  path: ^1.9.0
  sembast: ^3.8.0
  shared_preferences: ^2.3.0
  crypto: ^3.0.3
  on_audio_query: ^2.9.0

  # UI
  # 2.0 migrated to material_ui, which is not compatible with the MaterialApp
  # widget exported by this app's Flutter SDK yet.
  dynamic_color: ^1.9.0
  file_picker: ^13.3.0

  # Platform / app services
  package_info_plus: ^10.2.2
  url_launcher: ^6.2.5
  http: ^1.6.0
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # Local BSD-3-Clause patch: the upstream Android plugin lacks a namespace,
  # pins compileSdk 33, and targets mismatched Java/Kotlin bytecode levels.
  on_audio_query_android:
    path: third_party/on_audio_query_android

flutter:
  uses-material-design: true
  assets:
    - assets/images/
