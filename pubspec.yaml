name: nm_vybe
description: "NM VYBE — a free, local-first music player. Your music. Your vibe."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Audio engine
  just_audio: ^0.9.36
  just_audio_windows: ^0.2.3
  audio_service: ^0.18.12
  audio_session: ^0.1.16

  # Local library & storage
  path_provider: ^2.1.2
  path: ^1.9.0
  sembast: ^3.8.0
  shared_preferences: ^2.3.0
  crypto: ^3.0.3
  on_audio_query: ^2.9.0

  # UI
  dynamic_color: ^1.7.0
  palette_generator: ^0.3.3+4
  file_picker: ^8.3.7

  # Platform / app services
  package_info_plus: ^8.0.0
  http: ^1.2.0
  url_launcher: ^6.2.5
  ota_update: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
